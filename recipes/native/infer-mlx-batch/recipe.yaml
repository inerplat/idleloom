name: infer/mlx-batch
version: v1
description: Run one prompt with an MLX catalog model, the built-in Qwen by default, on a Native Metal host.
task: infer
backend: native
runtime: mlx
manifest: native-workload.yaml
parametersSchema: parameters.schema.json
example: example.yaml
prerequisites:
- A joined Native Metal host; the locked runtime and the model are prepared on first use.
- macOS 26 or later and Python 3.12 for first-use runtime preparation.
- The built-in qwen3-5-0-8b-mlx catalog entry installed by idlectl join, or an mlx-family IdleloomModel pinned to a Hugging Face commit.
