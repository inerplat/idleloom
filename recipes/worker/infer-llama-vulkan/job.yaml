apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: {{ quote .Name }}
  namespace: {{ quote .Namespace }}
  labels:
    app.kubernetes.io/managed-by: idleloom
    ai.idleloom.io/run: {{ quote .Name }}
    ai.idleloom.io/task: infer
    ai.idleloom.io/backend: worker
    ai.idleloom.io/runtime: llama-vulkan
  annotations:
    ai.idleloom.io/recipe: {{ quote .RecipeID }}
    ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
    ai.idleloom.io/input-digest: {{ quote .InputDigest }}
spec:
  devices:
    requests:
    - name: accelerator
      exactly:
        deviceClassName: {{ quote (index .Values "deviceClass") }}
        allocationMode: ExactCount
        count: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ quote .Name }}
  namespace: {{ quote .Namespace }}
  labels:
    app.kubernetes.io/managed-by: idleloom
    ai.idleloom.io/run: {{ quote .Name }}
    ai.idleloom.io/task: infer
    ai.idleloom.io/backend: worker
    ai.idleloom.io/runtime: llama-vulkan
  annotations:
    ai.idleloom.io/recipe: {{ quote .RecipeID }}
    ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
    ai.idleloom.io/input-digest: {{ quote .InputDigest }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ integer (index .Values "timeoutSeconds") }}
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: idleloom
        ai.idleloom.io/run: {{ quote .Name }}
        ai.idleloom.io/task: infer
        ai.idleloom.io/backend: worker
        ai.idleloom.io/runtime: llama-vulkan
      annotations:
        ai.idleloom.io/recipe: {{ quote .RecipeID }}
        ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
        ai.idleloom.io/input-digest: {{ quote .InputDigest }}
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
        idleloom-worker: "true"
        idleloom-accelerator: apple-vulkan
      tolerations:
      - key: idleloom-dedicated
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      resourceClaims:
      - name: gpu
        resourceClaimName: {{ quote .Name }}
      initContainers:
      # The cache lives on the worker's own disk, so kubelet cannot chown it the
      # way it does for managed volumes. Take CHOWN and nothing else.
      - name: model-cache-prepare
        image: quay.io/ramalama/ramalama@sha256:abe07beba518d6864738a67af8ea3511cdaa4b24efb197740967d0d8e19419e4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # DirectoryOrCreate already makes this 0755, so handing it to the
          # fetch user is enough. Do not chmod: that needs FOWNER on top, and
          # CHOWN alone is the smaller capability to hold.
          chown 65532:65532 /models
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - name: model
          mountPath: /models
      - name: model-fetch
        image: quay.io/ramalama/ramalama@sha256:abe07beba518d6864738a67af8ea3511cdaa4b24efb197740967d0d8e19419e4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # Content-addressed: the digest names the file, so a changed model or
          # quantisation lands beside the old one instead of silently reusing it.
          target="/models/${MODEL_SHA256}.gguf"
          if [ -f "$target" ] && echo "$MODEL_SHA256  $target" | sha256sum -c - >/dev/null 2>&1; then
            echo "cache hit: $target"
            exit 0
          fi
          # Download to a scratch name and rename, so an interrupted fetch can
          # never be mistaken for a warm cache entry on the next start. mktemp
          # rather than $$: Kubernetes collapses $$ to $ while expanding args,
          # which would leave every fetcher sharing one scratch name.
          partial="$(mktemp "${target}.partial.XXXXXX")"
          trap 'rm -f "$partial"' EXIT
          curl --fail --location --retry 3 --output "$partial" "$MODEL_URL"
          echo "$MODEL_SHA256  $partial" | sha256sum -c -
          # mktemp gives 0600; the cache is shared, so publish it readable.
          chmod 0644 "$partial"
          mv -f "$partial" "$target"
          echo "cached: $target"
        env:
        - name: MODEL_URL
          value: {{ quote (index .Values "modelURL") }}
        - name: MODEL_SHA256
          value: {{ quote (index .Values "modelSHA256") }}
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: model
          mountPath: /models
      containers:
      - name: inference
        image: quay.io/ramalama/ramalama@sha256:abe07beba518d6864738a67af8ea3511cdaa4b24efb197740967d0d8e19419e4
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - |
          devices="$(/usr/bin/llama-cli --list-devices 2>&1)"
          printf '%s\n' "$devices"
          printf '%s\n' "$devices" | grep -Eq 'Vulkan[0-9]+: Virtio-GPU Venus'
          exec /usr/bin/llama-cli "$@"
        - idleloom-llama
        - --model
        - {{ quote (printf "/models/%s.gguf" (index .Values "modelSHA256")) }}
        - --prompt
        - {{ quote (index .Values "prompt") }}
        - --predict
        - {{ quote (index .Values "maxTokens") }}
        - --gpu-layers
        - "99"
        - --ctx-size
        - "2048"
        - --no-display-prompt
        - --single-turn
        - --simple-io
        env:
        - name: VK_ICD_FILENAMES
          value: /usr/share/vulkan/icd.d/virtio_icd.aarch64.json
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/xdg-cache
        resources:
          requests:
            cpu: {{ quote (index .Values "cpu") }}
            memory: {{ quote (index .Values "memory") }}
          limits:
            cpu: {{ quote (index .Values "cpu") }}
            memory: {{ quote (index .Values "memory") }}
          claims:
          - name: gpu
            request: accelerator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: model
          mountPath: /models
          readOnly: true
        - name: runtime-cache
          mountPath: /tmp
      volumes:
      # The GGUF file is content-addressed and lives on the worker, shared with
      # the serving recipe by defaulting to the same cache directory, so a
      # repeated run reuses whichever workload downloaded it first.
      - name: model
        hostPath:
          path: {{ quote (index .Values "modelCacheDir") }}
          type: DirectoryOrCreate
      - name: runtime-cache
        emptyDir: {}
