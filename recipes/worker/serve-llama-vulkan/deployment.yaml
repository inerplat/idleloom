apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ quote .Name }}
  namespace: {{ quote .Namespace }}
  labels:
    app.kubernetes.io/managed-by: idleloom
    ai.idleloom.io/run: {{ quote .Name }}
    ai.idleloom.io/task: serve
    ai.idleloom.io/backend: worker
    ai.idleloom.io/runtime: llama-vulkan
  annotations:
    ai.idleloom.io/recipe: {{ quote .RecipeID }}
    ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
    ai.idleloom.io/input-digest: {{ quote .InputDigest }}
spec:
  metadata:
    labels:
      app.kubernetes.io/managed-by: idleloom
      ai.idleloom.io/run: {{ quote .Name }}
      ai.idleloom.io/task: serve
      ai.idleloom.io/backend: worker
      ai.idleloom.io/runtime: llama-vulkan
    annotations:
      ai.idleloom.io/recipe: {{ quote .RecipeID }}
      ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
      ai.idleloom.io/input-digest: {{ quote .InputDigest }}
  spec:
    devices:
      requests:
      - name: accelerator
        exactly:
          deviceClassName: {{ quote (index .Values "deviceClass") }}
          allocationMode: ExactCount
          count: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ quote .Name }}
  namespace: {{ quote .Namespace }}
  labels:
    app.kubernetes.io/managed-by: idleloom
    ai.idleloom.io/run: {{ quote .Name }}
    ai.idleloom.io/task: serve
    ai.idleloom.io/backend: worker
    ai.idleloom.io/runtime: llama-vulkan
  annotations:
    ai.idleloom.io/recipe: {{ quote .RecipeID }}
    ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
    ai.idleloom.io/input-digest: {{ quote .InputDigest }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  progressDeadlineSeconds: {{ integer (index .Values "startupTimeoutSeconds") }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      ai.idleloom.io/run: {{ quote .Name }}
      app.kubernetes.io/component: inference-server
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: idleloom
        app.kubernetes.io/component: inference-server
        ai.idleloom.io/run: {{ quote .Name }}
        ai.idleloom.io/task: serve
        ai.idleloom.io/backend: worker
        ai.idleloom.io/runtime: llama-vulkan
      annotations:
        ai.idleloom.io/recipe: {{ quote .RecipeID }}
        ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
        ai.idleloom.io/input-digest: {{ quote .InputDigest }}
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        idleloom-worker: "true"
        idleloom-accelerator: apple-vulkan
      tolerations:
      - key: idleloom-dedicated
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      resourceClaims:
      - name: gpu
        resourceClaimTemplateName: {{ quote .Name }}
      initContainers:
      # The cache lives on the worker's own disk, so kubelet cannot chown it the
      # way it does for managed volumes. Take CHOWN and nothing else.
      - name: model-cache-prepare
        image: {{ quote (index .Values "serverImage") }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # DirectoryOrCreate already makes this 0755, so handing it to the
          # fetch user is enough. Do not chmod: that needs FOWNER on top, and
          # CHOWN alone is the smaller capability to hold.
          chown 65532:65532 /models
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
          readOnlyRootFilesystem: true
          runAsUser: 0
        volumeMounts:
        - name: model
          mountPath: /models
      - name: model-fetch
        image: {{ quote (index .Values "serverImage") }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          # Content-addressed: the digest names the file, so a changed model or
          # quantisation lands beside the old one instead of silently reusing it.
          target="/models/${MODEL_SHA256}.gguf"
          if [ -f "$target" ] && echo "$MODEL_SHA256  $target" | sha256sum -c - >/dev/null 2>&1; then
            echo "cache hit: $target"
            exit 0
          fi
          # Download to a scratch name and rename, so an interrupted fetch can
          # never be mistaken for a warm cache entry on the next start. mktemp
          # rather than $$: Kubernetes collapses $$ to $ while expanding args,
          # which would leave every fetcher sharing one scratch name.
          partial="$(mktemp "${target}.partial.XXXXXX")"
          trap 'rm -f "$partial"' EXIT
          curl --fail --location --retry 3 --output "$partial" "$MODEL_URL"
          echo "$MODEL_SHA256  $partial" | sha256sum -c -
          # mktemp gives 0600; the cache is shared, so publish it readable.
          chmod 0644 "$partial"
          mv -f "$partial" "$target"
          echo "cached: $target"
        env:
        - name: MODEL_URL
          value: {{ quote (index .Values "modelURL") }}
        - name: MODEL_SHA256
          value: {{ quote (index .Values "modelSHA256") }}
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: model
          mountPath: /models
      containers:
      - name: server
        image: {{ quote (index .Values "serverImage") }}
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        args:
        - |
          devices="$(/usr/bin/llama-server --list-devices 2>&1)"
          printf '%s\n' "$devices"
          printf '%s\n' "$devices" | grep -Eq 'Vulkan[0-9]+: Virtio-GPU Venus'
          exec /usr/bin/llama-server "$@"
        - idleloom-llama-server
        - --model
        - /models/{{ index .Values "modelSHA256" }}.gguf
        - --alias
        - {{ quote (index .Values "modelAlias") }}
        - --host
        - 0.0.0.0
        - --port
        - {{ quote (index .Values "servicePort") }}
        - --gpu-layers
        - all
        # Every layer is offloaded, so the CPU-side mapping is dead weight once
        # the upload finishes. Keeping it mapped pins a second copy of the whole
        # model in guest RAM on top of the Vulkan buffers. On unified memory
        # that is the same physical RAM charged twice. Read the file instead so
        # nothing outlives the upload.
        - --no-mmap
        - --ctx-size
        - {{ quote (index .Values "contextSize") }}
        - --parallel
        - {{ quote (index .Values "parallel") }}
        - --api-key-file
        - /run/secrets/idleloom/api-key
        - --metrics
        - --no-webui
        env:
        - name: VK_ICD_FILENAMES
          value: /usr/share/vulkan/icd.d/virtio_icd.aarch64.json
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/xdg-cache
        ports:
        - name: http
          containerPort: {{ integer (index .Values "servicePort") }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        resources:
          requests:
            cpu: {{ quote (index .Values "cpu") }}
            memory: {{ quote (index .Values "memory") }}
          limits:
            cpu: {{ quote (index .Values "cpu") }}
            memory: {{ quote (index .Values "memory") }}
          claims:
          - name: gpu
            request: accelerator
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: model
          mountPath: /models
          readOnly: true
        - name: api-key
          mountPath: /run/secrets/idleloom
          readOnly: true
        - name: runtime-cache
          mountPath: /tmp
      volumes:
      # Node-local cache, not an emptyDir: the worker is a long-lived Node and a
      # multi-gigabyte GGUF must survive Pod restarts. Entries are named by
      # digest and are never pruned automatically. See the recipe reference.
      - name: model
        hostPath:
          path: {{ quote (index .Values "modelCacheDir") }}
          type: DirectoryOrCreate
      - name: runtime-cache
        emptyDir: {}
      - name: api-key
        secret:
          secretName: {{ quote (index .Values "apiKeySecret") }}
          defaultMode: 0440
          items:
          - key: api-key
            path: api-key
---
apiVersion: v1
kind: Service
metadata:
  name: {{ quote .Name }}
  namespace: {{ quote .Namespace }}
  labels:
    app.kubernetes.io/managed-by: idleloom
    ai.idleloom.io/run: {{ quote .Name }}
    ai.idleloom.io/task: serve
    ai.idleloom.io/backend: worker
    ai.idleloom.io/runtime: llama-vulkan
  annotations:
    ai.idleloom.io/recipe: {{ quote .RecipeID }}
    ai.idleloom.io/recipe-digest: {{ quote .RecipeDigest }}
    ai.idleloom.io/input-digest: {{ quote .InputDigest }}
spec:
  type: ClusterIP
  selector:
    ai.idleloom.io/run: {{ quote .Name }}
    app.kubernetes.io/component: inference-server
  ports:
  - name: http
    port: {{ integer (index .Values "servicePort") }}
    targetPort: http
    protocol: TCP
