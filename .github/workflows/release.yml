name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...

  # The Vulkan DRA driver runs inside the Worker VM, so this is linux/arm64
  # only. Build it on an arm64 runner rather than under emulation: the image
  # compiles C against libvulkan and runs glslangValidator, which QEMU makes
  # slow enough to matter.
  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/inerplat/idleloom-vulkan-dra
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Report the digest to pin
        run: |
          echo "::notice title=DRA image::docker.io/inerplat/idleloom-vulkan-dra@${{ steps.build.outputs.digest }}"

  package:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build signed Native Metal CLI
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          package="dist/idleloom-${VERSION}-darwin-arm64"
          mkdir -p "$package"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${build_date}"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o "$package/idlectl" ./cmd/idlectl
          codesign --force --sign - "$package/idlectl"
          cp LICENSE "$package/LICENSE"
          codesign --verify --strict "$package/idlectl"
          "$package/idlectl" version
          archive="${PWD}/dist/idleloom-${VERSION}-darwin-arm64.tar.gz"
          tar -C "$package" -czf "$archive" .
          cd dist
          shasum -a 256 "idleloom-${VERSION}-darwin-arm64.tar.gz" > idleloom-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: idleloom-release
          path: |
            dist/idleloom-*.tar.gz
            dist/idleloom-checksums.txt
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: idleloom-release
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=(--verify-tag --generate-notes --title "Idleloom ${TAG}")
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${options[@]}" --repo "${GITHUB_REPOSITORY}"
